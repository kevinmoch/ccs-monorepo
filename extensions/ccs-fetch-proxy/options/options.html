<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CCS Fetch Proxy — 设置</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        width: 420px;
        margin: 0;
        padding: 16px;
        color: #1f2937;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 12px;
        line-height: 1.6;
      }
      #whitelist {
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        resize: vertical;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        font-size: 13px;
        padding: 6px 16px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      #status {
        font-size: 12px;
        margin-left: auto;
        color: #16a34a;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>外壳（Shell）来源白名单</h1>
    <p>
      每行一个完整 origin（协议 + 域名 + 端口，结尾不带斜杠）。仅当标签页顶层页面命中白名单时，扩展才会： 1)
      在该顶层窗口安装
      <code>window.ccsExtFetch</code>；2) 对其内嵌的跨域子网站 iframe 激活新窗口拦截。 默认值：<code
        >https://localhost:3000</code
      >
    </p>
    <textarea id="whitelist" spellcheck="false"></textarea>
    <div class="actions">
      <button id="save" class="primary">保存</button>
      <button id="reset">恢复默认</button>
      <span id="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
